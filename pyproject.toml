[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "atunapy"  # Name on PyPI
version = "1.1.1"
authors = [{ name="Aylin del Moral", email="aylindmm@gmail.com" }]
description = "A package for LLM-aided literature extraction."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas",
    "rdkit>=2025.9.5",
    "tqdm",
    "dotenv>=0.9.9",
    "openai>=2.6.1",
    "pydantic>=2.0",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.1",
    "langchain-core>=1.5.2",
    "langchain-google-genai>=4.3.2",
    "langchain-anthropic>=1.5.3",
    "pubchempy==1.0.5",
    "langchain-groq>=1.1.3",
    "bio==1.8.1"
]